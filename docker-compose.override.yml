version: '3.8'

# Development override - enables hot reloading and development settings
# Usage: docker compose -f docker-compose.yml -f docker-compose.override.yml up

services:
  postgres:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-millebornes-dev-password-change-in-production}

  redis:
    ports:
      - "6379:6379"

  api:
    env_file:
      - path: .env.development
        required: true
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,api,frontend"
      CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      CSRF_COOKIE_SECURE: "false"
      SESSION_COOKIE_SECURE: "false"
      JWT_REFRESH_COOKIE_SECURE: "false"
    command: >
      sh -c "
        until python manage.py migrate --noinput 2>&1; do
          echo 'Waiting for database...'
          sleep 2
        done &&
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./backend:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: millebornes-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/dist
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - VITE_WS_BASE_URL=ws://localhost:8000
    stdin_open: true
    tty: true
    depends_on:
      - api

  nginx:
    profiles: ["production"]
    # Nginx is disabled in development - frontend and API accessed directly